<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 860" role="img" aria-label="Arquitetura da Clyvo Vet com o fluxo numerado de CI e CD">
  <rect width="1360" height="860" fill="#F3F6F9"/>
  <text x="680" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#163A54">Clyvo Vet  -  Arquitetura e esteira CI/CD</text>
  <text x="680" y="62" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4A6572">Sprint 4 · DevOps Tools &amp; Cloud Computing · os números são a ordem da esteira</text>

  <rect x="24" y="88" width="300" height="132" rx="12" fill="#F7F1FB" stroke="#5C2D91" stroke-width="2"/>
  <circle cx="52" cy="118" r="14" fill="#5C2D91"/>
  <text x="52" y="123" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
  <text x="76" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#5C2D91">Persona · Desenvolvedor</text>
  <text x="44" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333333">Altera o código da API e envia</text>
  <text x="44" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333333">o commit para a branch master.</text>
  <text x="44" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6B4C8A">Ferramenta: IDE e Git</text>

  <rect x="24" y="244" width="300" height="118" rx="12" fill="#24292F"/>
  <text x="174" y="286" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">GitHub</text>
  <text x="174" y="310" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#D0D7DE">Clone da API no CI</text>
  <text x="174" y="332" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8B949E">Branch master · gatilho do CI</text>

  <rect x="24" y="560" width="300" height="168" rx="12" fill="#FFF8E8" stroke="#C4A035" stroke-width="2"/>
  <circle cx="52" cy="592" r="14" fill="#0078D4"/>
  <text x="52" y="597" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">8</text>
  <text x="76" y="598" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#7A5C00">Persona · Usuário da clínica</text>
  <text x="44" y="628" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333333">Abre a página publicada e o Swagger.</text>
  <text x="44" y="650" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333333">Faz o CRUD de tutor e pet.</text>
  <text x="44" y="672" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333333">Confere cada operação com SELECT.</text>
  <text x="44" y="702" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7A5C00">Ferramentas: navegador e sqlplus</text>

  <rect x="360" y="88" width="470" height="500" rx="14" fill="#FFFFFF" stroke="#0078D4" stroke-width="3"/>
  <rect x="360" y="88" width="470" height="46" rx="14" fill="#0078D4"/>
  <rect x="360" y="118" width="470" height="16" fill="#0078D4"/>
  <text x="595" y="118" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Azure DevOps · Azure Pipelines</text>

  <circle cx="396" cy="168" r="14" fill="#0078D4"/>
  <text x="396" y="173" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
  <text x="422" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#163A54">CI dispara na branch master</text>
  <text x="422" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4A6572">azure-pipelines.yml · estágio CI</text>

  <circle cx="396" cy="230" r="14" fill="#0078D4"/>
  <text x="396" y="235" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
  <text x="422" y="226" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#163A54">Clona a API, restaura e compila</text>
  <text x="422" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4A6572">Ferramenta: .NET SDK 10</text>

  <circle cx="396" cy="292" r="14" fill="#0078D4"/>
  <text x="396" y="297" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
  <text x="422" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#163A54">Executa os testes e publica o resultado</text>
  <text x="422" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4A6572">Ferramenta: xUnit · aba Tests do Azure DevOps</text>

  <circle cx="396" cy="354" r="14" fill="#0078D4"/>
  <text x="396" y="359" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">5</text>
  <text x="422" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#163A54">Publica o artefato clyvovet-api</text>
  <text x="422" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4A6572">Ferramenta: artefato da pipeline no Azure DevOps</text>

  <circle cx="396" cy="416" r="14" fill="#0078D4"/>
  <text x="396" y="421" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">6</text>
  <text x="422" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#163A54">CD começa com o artefato novo</text>
  <text x="422" y="432" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4A6572">Estágio CD · service connection sc-clyvovet-azure</text>

  <rect x="384" y="468" width="422" height="96" rx="10" fill="#F4F8FC" stroke="#9EC3E6"/>
  <text x="404" y="498" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#163A54">Variáveis protegidas</text>
  <text x="404" y="522" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4A6572">Grupo clyvovet-sprint4. Senha do ACR e connection</text>
  <text x="404" y="542" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4A6572">string do Oracle marcadas como secret.</text>

  <rect x="860" y="88" width="476" height="640" rx="14" fill="#FFFFFF" stroke="#0078D4" stroke-width="3"/>
  <rect x="860" y="88" width="476" height="46" rx="14" fill="#0B5CAB"/>
  <rect x="860" y="118" width="476" height="16" fill="#0B5CAB"/>
  <text x="1098" y="118" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Microsoft Azure · rg-clyvovet-sprint4</text>

  <rect x="888" y="160" width="420" height="110" rx="10" fill="#E8F3FC" stroke="#0078D4" stroke-width="2"/>
  <circle cx="916" cy="198" r="14" fill="#0078D4"/>
  <text x="916" y="203" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">7</text>
  <text x="942" y="194" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0078D4">Azure Container Registry</text>
  <text x="942" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#163A54">Imagem clyvovet-api, montada com o artefato</text>
  <text x="942" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4A6572">Ferramenta: ACR · a imagem da API não roda como root</text>

  <rect x="888" y="300" width="420" height="150" rx="10" fill="#E7F6EC" stroke="#107C10" stroke-width="2"/>
  <text x="1098" y="332" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#107C10">Azure Container Instances · API</text>
  <text x="1098" y="358" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#163A54">aci-clyvovet-api · porta 8080</text>
  <text x="1098" y="382" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333333">Página inicial e Swagger da Clyvo Vet</text>
  <text x="1098" y="406" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#3B6D11">O CD recria este container. O banco permanece.</text>
  <text x="1098" y="428" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4A6572">Ferramenta: Azure Container Instances</text>

  <line x1="1098" y1="450" x2="1098" y2="486" stroke="#107C10" stroke-width="3"/>
  <polygon points="1098,486 1091,472 1105,472" fill="#107C10"/>

  <rect x="888" y="486" width="420" height="150" rx="10" fill="#FFF4F2" stroke="#C74634" stroke-width="2"/>
  <text x="1098" y="518" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#C74634">Oracle em container</text>
  <text x="1098" y="544" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#163A54">aci-clyvovet-oracle · 1521 · XEPDB1</text>
  <text x="1098" y="568" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333333">Usuário CLYVOVET · script_bd.sql</text>
  <text x="1098" y="592" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333333">CORE: TUTOR e PET, entre outras</text>
  <text x="1098" y="614" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4A6572">Ferramenta: Oracle XE no ACI</text>

  <line x1="174" y1="220" x2="174" y2="244" stroke="#5C2D91" stroke-width="2"/>
  <polygon points="174,244 168,232 180,232" fill="#5C2D91"/>
  <line x1="324" y1="300" x2="360" y2="168" stroke="#0078D4" stroke-width="2"/>
  <polygon points="360,168 346,164 352,178" fill="#0078D4"/>
  <line x1="830" y1="416" x2="888" y2="210" stroke="#0078D4" stroke-width="2"/>
  <polygon points="888,210 872,206 878,220" fill="#0078D4"/>
  <line x1="888" y1="375" x2="844" y2="375" stroke="#C4A035" stroke-width="2"/>
  <line x1="844" y1="375" x2="844" y2="704" stroke="#C4A035" stroke-width="2"/>
  <line x1="844" y1="704" x2="332" y2="704" stroke="#C4A035" stroke-width="2"/>
  <polygon points="324,704 338,698 338,710" fill="#C4A035"/>

  <rect x="24" y="760" width="1312" height="76" rx="10" fill="#FFFFFF" stroke="#C8D1D9"/>
  <text x="44" y="788" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#163A54">Onde cada ferramenta entra</text>
  <text x="44" y="812" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333333">GitHub guarda o código. Azure Pipelines compila, testa e publica o artefato. ACR guarda a imagem. ACI executa a API e o Oracle. O usuário fala com a API; a API persiste no Oracle.</text>
</svg>
